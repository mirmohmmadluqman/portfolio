<style>
  *,*::before,*::after{box-sizing:border-box;}
  :root{
    --bg:#08080a;
    --panel:rgba(255,255,255,.035);
    --panel-strong:rgba(255,255,255,.06);
    --panel-border:rgba(255,255,255,.09);
    --panel-border-strong:rgba(255,255,255,.22);
    --text:#F6F3EC;
    --text-dim:#a4a29c;
    --text-faint:#6c6a65;
    --accent:#F2B84B;
    --accent-2:#6C8CFF;
    --like:#ff5470;
    --radius-lg:22px;
    --radius-md:16px;
    --font-display:'Clash Display','Satoshi',sans-serif;
    --font-body:'Satoshi',ui-sans-serif,system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
    --ease:cubic-bezier(.16,.8,.24,1);
  }
  @property --spin{syntax:'<angle>';inherits:false;initial-value:0deg;}
  html{background:var(--bg);scroll-behavior:smooth;}
  body{
    margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;
  }
  ::selection{background:var(--accent);color:#0c0c0d;}
  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;}
  img{max-width:100%;display:block;}
  .mono{font-family:var(--font-mono);}

  /* ---------- ambient background ---------- */
  .ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
  .ambient .blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.4;mix-blend-mode:screen;}
  .blob.gold{width:560px;height:560px;top:-14%;left:-12%;background:radial-gradient(circle at 30% 30%,var(--accent),transparent 70%);animation:drift1 24s ease-in-out infinite;}
  .blob.indigo{width:620px;height:620px;bottom:-18%;right:-12%;background:radial-gradient(circle at 60% 40%,var(--accent-2),transparent 70%);animation:drift2 28s ease-in-out infinite;}
  .ambient .grid{position:absolute;inset:-2px;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),black 0%,transparent 70%);mask-image:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),black 0%,transparent 70%);}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(60px,40px) scale(1.1);}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-50px,-30px) scale(1.08);}}
  .spotlight{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(560px circle at var(--mx,50%) var(--my,50%),rgba(242,184,75,.07),transparent 40%);}

  /* ---------- progress bar ---------- */
  .progress{position:fixed;top:0;left:0;height:3px;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));z-index:200;}

  /* ---------- floating action buttons ---------- */
  .fab-row{position:fixed;top:18px;right:18px;z-index:50;display:flex;gap:10px;}
  .icon-btn{position:relative;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.06);backdrop-filter:blur(12px);border:1px solid var(--panel-border);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .3s var(--ease),background .3s,border-color .3s;}
  .icon-btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.12);border-color:var(--panel-border-strong);}
  .icon-btn svg{width:19px;height:19px;}
  .icon-btn.liked svg path{fill:var(--like);stroke:var(--like);}
  .particle{position:absolute;top:50%;left:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--accent);animation:particle .6s ease-out forwards;pointer-events:none;}
  @keyframes particle{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0;}}

  /* ---------- layout ---------- */
  .page{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:104px 20px 60px;display:flex;flex-direction:column;gap:16px;}

  /* ---------- reveal ---------- */
  .reveal{opacity:0;transform:translateY(26px);filter:blur(6px);transition:opacity .8s var(--ease),transform .8s var(--ease),filter .8s var(--ease);transition-delay:calc(var(--i,0) * 45ms);}
  .reveal.in-view{opacity:1;transform:none;filter:blur(0);}

  /* ---------- hero ---------- */
  .hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding-bottom:8px;}
  .avatar-ring{width:96px;height:96px;border-radius:50%;padding:3px;background:conic-gradient(from var(--spin,0deg),var(--accent),var(--accent-2),var(--accent));animation:spin 7s linear infinite;}
  .avatar-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg);background:var(--bg);}
  @keyframes spin{to{--spin:360deg;}}
  .eyebrow{font-family:var(--font-mono);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);}
  .hero-title{font-family:var(--font-display);font-weight:500;font-size:clamp(28px,6vw,42px);line-height:1.18;letter-spacing:-.01em;max-width:19ch;margin:0 auto;min-height:1.2em;}
  .hero-cta{margin-top:6px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 30px;border-radius:999px;background:var(--text);color:#0c0c0d;font-family:var(--font-display);font-weight:500;font-size:15px;border:none;cursor:pointer;text-decoration:none;transition:box-shadow .3s var(--ease),transform .2s var(--ease);box-shadow:0 0 0 rgba(242,184,75,0);}
  .btn:hover{box-shadow:0 10px 34px -8px rgba(242,184,75,.5);}
  .btn:active{transform:scale(.97);}
  .socials{display:flex;gap:10px;margin-top:2px;}
  .social-btn{position:relative;overflow:hidden;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid var(--panel-border);transition:transform .3s var(--ease),border-color .3s;text-decoration:none;}
  .social-btn svg{width:20px;height:20px;position:relative;z-index:1;}
  .social-btn:hover{transform:translateY(-3px);border-color:var(--accent);}

  /* ---------- spotlight-card system ---------- */
  .spot{position:relative;}
  .spot::before{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(220px circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.10),transparent 60%);opacity:0;transition:opacity .4s;pointer-events:none;z-index:0;}
  .spot:hover::before{opacity:1;}
  .spot > *{position:relative;z-index:1;}

  /* ---------- panels ---------- */
  .panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:var(--radius-lg);padding:26px 24px;backdrop-filter:blur(20px);}
  .panel-title{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:17px;font-weight:500;margin:0 0 18px;}
  .panel-title .icon{width:20px;height:20px;color:var(--accent);flex-shrink:0;display:flex;}
  .panel-title.mono{font-family:var(--font-mono);font-size:14px;color:var(--text-dim);font-weight:500;}

  /* ---------- contact ---------- */
  .contact-form{display:flex;flex-direction:column;gap:12px;}
  .field input,.field textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--panel-border);border-radius:14px;padding:14px 16px;color:var(--text);font-family:var(--font-body);font-size:15px;outline:none;transition:border-color .3s,background .3s;resize:vertical;font-weight:400;}
  .field textarea{min-height:96px;}
  .field input:focus,.field textarea:focus{border-color:var(--accent);background:rgba(255,255,255,.06);}
  .field input::placeholder,.field textarea::placeholder{color:var(--text-faint);}
  .contact-form .btn{width:100%;margin-top:2px;}

  /* ---------- projects ---------- */
  .project-grid{display:flex;flex-direction:column;gap:12px;}
  .project-card{display:flex;gap:15px;padding:18px;border-radius:var(--radius-md);background:rgba(255,255,255,.03);border:1px solid var(--panel-border);text-decoration:none;color:inherit;transition:border-color .3s;}
  .project-card img{width:44px;height:44px;object-fit:contain;border-radius:10px;background:rgba(255,255,255,.06);padding:7px;flex-shrink:0;}
  .project-card .body{min-width:0;}
  .project-card h3{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:6px;}
  .project-card p{font-size:13.5px;line-height:1.55;color:var(--text-dim);margin:0;}
  .project-card .arrow{margin-left:auto;align-self:flex-start;opacity:.45;transition:transform .3s var(--ease),opacity .3s,color .3s;flex-shrink:0;}
  .project-card:hover{border-color:var(--panel-border-strong);}
  .project-card:hover .arrow{transform:translate(3px,-3px);opacity:1;color:var(--accent);}

  /* ---------- links ---------- */
  .link-list{display:flex;flex-direction:column;gap:10px;}
  .link-row{display:flex;align-items:center;gap:14px;padding:11px 14px 11px 11px;border-radius:var(--radius-md);background:rgba(255,255,255,.03);border:1px solid var(--panel-border);text-decoration:none;color:inherit;transition:border-color .3s;}
  .link-row img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .link-row .meta{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .link-row .meta strong{font-family:var(--font-display);font-size:15px;font-weight:500;}
  .link-row .meta span{font-size:12.5px;color:var(--text-faint);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .link-row .arrow{margin-left:auto;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .35s var(--ease),background .35s,color .35s;}
  .link-row .arrow svg{width:14px;height:14px;}
  .link-row:hover .arrow{transform:rotate(45deg) scale(1.08);background:var(--accent);color:#0c0c0d;}
  .link-row:hover{border-color:var(--panel-border-strong);}

  /* ---------- skills ---------- */
  .skill-tags{display:flex;flex-wrap:wrap;gap:10px;}
  .skill-tag{padding:11px 18px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--panel-border);font-size:13.5px;transition:border-color .3s,transform .3s var(--ease),background .3s;}
  .skill-tag:hover{border-color:var(--accent);background:rgba(242,184,75,.09);transform:translateY(-2px);}

  /* ---------- stack ---------- */
  .stack-count{font-size:12.5px;color:var(--text-faint);margin:-8px 0 18px;}
  .stack-count span{color:var(--accent);font-weight:600;}
  .stack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px;}
  .stack-tile{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--panel-border);text-decoration:none;transition:transform .35s var(--ease),border-color .3s,background .3s;}
  .stack-tile img{width:38%;height:38%;object-fit:contain;filter:grayscale(.2) opacity(.9);transition:filter .3s,transform .35s var(--ease);}
  .stack-tile:hover{transform:translateY(-4px) scale(1.06);border-color:var(--accent);background:rgba(255,255,255,.07);z-index:2;}
  .stack-tile:hover img{filter:none;transform:scale(1.08);}
  .stack-tile .tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);background:#131315;color:var(--text);font-size:11px;padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;border:1px solid var(--panel-border-strong);font-family:var(--font-mono);}
  .stack-tile:hover .tip{opacity:1;transform:translate(-50%,0);}

  /* ---------- footer ---------- */
  .footer{text-align:center;padding:36px 0 8px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--text-faint);}
  .footer .socials{margin:0;}
  .footer p{font-size:12px;letter-spacing:.03em;margin:0;}
  .blink{display:inline-block;color:var(--accent);animation:blink 1.1s step-end infinite;}
  @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}

  /* ---------- toasts ---------- */
  .toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:300;align-items:center;pointer-events:none;}
  .toast{background:#141416;border:1px solid var(--panel-border-strong);color:var(--text);padding:11px 20px;border-radius:999px;font-size:13.5px;opacity:0;transform:translateY(10px);transition:opacity .35s var(--ease),transform .35s var(--ease);box-shadow:0 14px 40px -12px rgba(0,0,0,.65);white-space:nowrap;}
  .toast.show{opacity:1;transform:translateY(0);}

  @media (max-width:520px){
    .page{padding-top:88px;}
    .panel{padding:22px 18px;}
    .fab-row{top:14px;right:14px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
    .reveal{opacity:1;transform:none;filter:none;}
    .avatar-ring{animation:none;}
  }
</style>
</head>

<script>
(function(){
  "use strict";

  var DATA = {
    projects: [
      { title:"Security Playground", url:"https://securitypg.vercel.app/", image:"https://firebasestorage.googleapis.com/v0/b/tiny-sites-81c15.firebasestorage.app/o/websiteImages%2FYBfXg21kg6ggepMkmUXBn2gLs3j2%2FmyProjectImage-android-chrome-192x192-1770892999052143654.png?alt=media&token=d7e983d8-385f-4cca-b1da-cbfe725e5a1e", desc:"Master the art of smart contract security. Exploit real vulnerabilities, patch code, and level up your auditing skills." },

    ],
    links: [
      { text:"cat portfolio.ink", sub:". env/ my_portfolio = ...", url:"https://mirmohmmadluqman.github.io/portfolio/", image:"https://firebasestorage.googleapis.com/v0/b/tiny-sites-81c15.firebasestorage.app/o/websiteImages%2FYBfXg21kg6ggepMkmUXBn2gLs3j2%2FlinkButton-LOGO_DOGE-1770893372073018370.png?alt=media&token=748696ad-6472-4209-82ef-7348fbf3aaa6" },
      { text:"LinkedIn Profile", sub:"linkedin.com/in/mirmohmmadluqman", url:"https://www.linkedin.com/in/mirmohmmadluqman/", image:"https://firebasestorage.googleapis.com/v0/b/tiny-sites-81c15.firebasestorage.app/o/websiteImages%2FYBfXg21kg6ggepMkmUXBn2gLs3j2%2FlinkButton-Gemini_Generated_Image_yo0mjcyo0mjcyo0m-1770895777060266933.png?alt=media&token=20dc5863-aded-4af8-957c-99d5aeb8e116" },

      {title:"NPM", icon:"https://svgl.app/library/npm.svg", link:"https://www.npmjs.com/"},
      {title:"Figma", icon:"https://svgl.app/library/figma.svg", link:"https://www.figma.com/"},
      {title:"TypeScript", icon:"https://svgl.app/library/typescript.svg", link:"https://www.typescriptlang.org"},
      {title:"Cursor", icon:"https://svgl.app/library/cursor_dark.svg", link:"https://www.cursor.com"},
      {title:"GoDaddy", icon:"https://svgl.app/library/godaddy_dark.svg", link:"https://www.godaddy.com/"},
      {title:"Vercel", icon:"https://svgl.app/library/vercel_dark.svg", link:"https://vercel.com/"},
      {title:"Ollama", icon:"https://svgl.app/library/ollama_dark.svg", link:"https://www.ollama.com/"},
      {title:"Groq", icon:"https://svgl.app/library/groq.svg", link:"https://groq.com/"},
      {title:"Google Drive", icon:"https://svgl.app/library/drive.svg", link:"https://drive.google.com/"},
      {title:"Discord", icon:"https://svgl.app/library/discord.svg", link:"https://discord.com/"},
      {title:"GitHub", icon:"https://svgl.app/library/github_dark.svg", link:"https://github.com/"},
      {title:"VS Code", icon:"https://svgl.app/library/vscode.svg", link:"https://code.visualstudio.com/"},
      {title:"AliExpress", icon:"https://svgl.app/library/aliexpress-icon.svg", link:"https://aliexpress.com/"},
      {title:"LinkedIn", icon:"https://svgl.app/library/linkedin.svg", link:"https://www.linkedin.com/"},
      {title:"Vim", icon:"https://svgl.app/library/vim.svg", link:"https://www.vim.org/"},
      {title:"CSS", icon:"https://svgl.app/library/css_old.svg", link:"https://developer.mozilla.org/en-US/docs/Web/CSS"},
      {title:"HTML5", icon:"https://svgl.app/library/html5.svg", link:"https://developer.mozilla.org/en-US/docs/Web/HTML"},
      {title:"Bash", icon:"https://svgl.app/library/bash_dark.svg", link:"https://www.gnu.org/software/bash/"},
      {title:"Supabase", icon:"https://svgl.app/library/supabase.svg", link:"https://supabase.com/"},
      {title:"Firebase", icon:"https://svgl.app/library/firebase.svg", link:"https://firebase.google.com/"}
    ]
  };

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  /* ---------------- render ---------------- */
  function el(tag, cls){ var e = document.createElement(tag); if(cls) e.className = cls; return e; }
  function externalArrow(){
    var span = el('span','arrow');
    span.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>';
    return span;
  }

  var projectGrid = document.getElementById('projectGrid');
  DATA.projects.forEach(function(p, i){
    var a = el('a','project-card spot reveal');
    a.href = p.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.style.setProperty('--i', i);
    var img = el('img'); img.src = p.image; img.alt = p.title; img.loading = 'lazy';
    var body = el('div','body');
    var h3 = el('h3'); h3.textContent = p.title;
    var pEl = el('p'); pEl.textContent = p.desc;
    body.appendChild(h3); body.appendChild(pEl);
    a.appendChild(img); a.appendChild(body); a.appendChild(externalArrow());
    projectGrid.appendChild(a);
  });

  var linkList = document.getElementById('linkList');
  DATA.links.forEach(function(l, i){
    var a = el('a','link-row spot reveal');
    a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.style.setProperty('--i', i);
    var img = el('img'); img.src = l.image; img.alt = l.text; img.loading = 'lazy';
    var meta = el('div','meta');
    var strong = el('strong'); strong.textContent = l.text;
    var span = el('span'); span.textContent = l.sub || '';
    meta.appendChild(strong); if(l.sub) meta.appendChild(span);
    var arrow = el('span','arrow');
    arrow.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';
    a.appendChild(img); a.appendChild(meta); a.appendChild(arrow);
    linkList.appendChild(a);
  });

  var skillTags = document.getElementById('skillTags');
  DATA.skills.forEach(function(s, i){
    var span = el('span','skill-tag reveal');
    span.style.setProperty('--i', i);
    span.textContent = s;
    skillTags.appendChild(span);
  });

  var stackGrid = document.getElementById('stackGrid');
  DATA.stack.forEach(function(s, i){
    var a = el('a','stack-tile reveal');
    a.href = s.link; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.style.setProperty('--i', i % 12);
    var img = el('img'); img.src = s.icon; img.alt = s.title; img.loading = 'lazy';
    var tip = el('span','tip'); tip.textContent = s.title;
    a.appendChild(img); a.appendChild(tip);
    stackGrid.appendChild(a);
  });
  document.getElementById('footerLine').textContent = '// ' + new Date().getFullYear() + ' Mir Luqman — end of file';

  /* ---------------- decrypt hero title ---------------- */
  function decryptText(node, duration){
    var final = node.dataset.text || node.textContent;
    if(reduceMotion){ node.textContent = final; return; }
    var chars = "#%&01!?/\\<>{}[]=+*";
    var len = final.length;
    var start = null;
    function frame(ts){
      if(start === null) start = ts;
      var t = Math.min(1, (ts - start) / duration);
      var revealCount = Math.floor(t * len);
      var out = "";
      for(var i=0;i<len;i++){
        var ch = final[i];
        if(ch === " "){ out += " "; continue; }
        out += (i < revealCount) ? ch : chars[Math.floor(Math.random()*chars.length)];
      }
      node.textContent = out;
      if(t < 1) requestAnimationFrame(frame);
      else node.textContent = final;
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener('load', function(){
    setTimeout(function(){ decryptText(document.getElementById('heroTitle'), 900); }, 200);
  });

  /* ---------------- reveal on scroll ---------------- */
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){ entry.target.classList.add('in-view'); io.unobserve(entry.target); }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.reveal').forEach(function(node){ io.observe(node); });

  /* ---------------- cursor spotlight + grid mask ---------------- */
  if(canHover && !reduceMotion){
    var raf = null, lastX = 0, lastY = 0;
    window.addEventListener('mousemove', function(e){
      lastX = e.clientX; lastY = e.clientY;
      if(raf) return;
      raf = requestAnimationFrame(function(){
        document.documentElement.style.setProperty('--mx', lastX + 'px');
        document.documentElement.style.setProperty('--my', lastY + 'px');
        raf = null;
      });
    }, { passive:true });
  }

  /* ---------------- spotlight cards + tilt ---------------- */
  function attachSpot(node, opts){
    opts = opts || {};
    node.addEventListener('mousemove', function(e){
      var r = node.getBoundingClientRect();
      var x = e.clientX - r.left, y = e.clientY - r.top;
      node.style.setProperty('--x', x + 'px');
      node.style.setProperty('--y', y + 'px');
      if(opts.tilt){
        var px = (x / r.width - 0.5) * 2;
        var py = (y / r.height - 0.5) * 2;
        node.style.transform = 'perspective(700px) rotateY(' + (px*opts.tilt) + 'deg) rotateX(' + (-py*opts.tilt) + 'deg)';
      }
    });
    node.addEventListener('mouseleave', function(){
      if(opts.tilt) node.style.transform = '';
    });
  }
  if(canHover && !reduceMotion){
    document.querySelectorAll('.spot').forEach(function(node){
      var tilt = node.classList.contains('project-card') || node.classList.contains('link-row') ? 5 : false;
      attachSpot(node, { tilt: tilt });
    });
    document.querySelectorAll('.project-card, .link-row').forEach(function(n){ n.classList.add('spot'); attachSpot(n, {tilt:5}); });
  }

  /* ---------------- magnetic buttons ---------------- */
  function attachMagnetic(node, strength, max){
    node.addEventListener('mousemove', function(e){
      var r = node.getBoundingClientRect();
      var x = e.clientX - (r.left + r.width/2);
      var y = e.clientY - (r.top + r.height/2);
      var dx = Math.max(-max, Math.min(max, x*strength));
      var dy = Math.max(-max, Math.min(max, y*strength));
      node.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    });
    node.addEventListener('mouseleave', function(){ node.style.transform = ''; });
  }
  if(canHover && !reduceMotion){
    document.querySelectorAll('.btn').forEach(function(b){ attachMagnetic(b, 0.25, 10); });
    document.querySelectorAll('.icon-btn, .social-btn').forEach(function(b){ attachMagnetic(b, 0.3, 8); });
  }

  /* ---------------- progress bar ---------------- */
  var progressEl = document.getElementById('progress');
  function updateProgress(){
    var h = document.documentElement;
    var scrolled = h.scrollTop || document.body.scrollTop;
    var height = h.scrollHeight - h.clientHeight;
    var pct = height > 0 ? (scrolled/height)*100 : 0;
    progressEl.style.width = pct + '%';
  }
  var progressRaf = null;
  window.addEventListener('scroll', function(){
    if(progressRaf) return;
    progressRaf = requestAnimationFrame(function(){ updateProgress(); progressRaf = null; });
  }, { passive:true });
  updateProgress();

  /* ---------------- toasts ---------------- */
  var toastContainer = document.getElementById('toastContainer');
  function toast(msg){
    var t = el('div','toast');
    t.textContent = msg;
    toastContainer.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add('show'); });
    setTimeout(function(){
      t.classList.remove('show');
      setTimeout(function(){ t.remove(); }, 350);
    }, 2400);
  }

  /* ---------------- share ---------------- */
  document.getElementById('shareBtn').addEventListener('click', function(){
    var shareData = { title: document.title, text: 'Mir Luqman — Web3 Security Researcher & Developer', url: window.location.href };
    if(navigator.share){
      navigator.share(shareData).catch(function(){});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(window.location.href).then(function(){ toast('Link copied to clipboard'); });
    } else {
      toast(window.location.href);
    }
  });

  /* ---------------- like ---------------- */
  var likeBtn = document.getElementById('likeBtn');
  var liked = false;
  try { liked = localStorage.getItem('portfolio_liked') === '1'; } catch(e){}
  function paintLike(){ likeBtn.classList.toggle('liked', liked); }
  paintLike();
  function burst(node){
    for(var i=0;i<6;i++){
      var p = el('span','particle');
      var angle = (Math.PI*2*i)/6;
      p.style.setProperty('--dx', (Math.cos(angle)*26) + 'px');
      p.style.setProperty('--dy', (Math.sin(angle)*26) + 'px');
      node.appendChild(p);
      (function(pp){ setTimeout(function(){ pp.remove(); }, 650); })(p);
    }
  }
  likeBtn.addEventListener('click', function(){
    liked = !liked;
    try { localStorage.setItem('portfolio_liked', liked ? '1' : '0'); } catch(e){}
    paintLike();
    if(liked && !reduceMotion) burst(likeBtn);
  });

  /* ---------------- contact form ---------------- */
  document.getElementById('contactForm').addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('cName').value.trim();
    var email = document.getElementById('cEmail').value.trim();
    var message = document.getElementById('cMessage').value.trim();
    if(!name || !email || !message){ toast('Please fill in every field'); return; }
    var subject = encodeURIComponent('Portfolio contact from ' + name);
    var body = encodeURIComponent(message + '\n\n— ' + name + ' (' + email + ')');
    window.location.href = 'mailto:mirmohmmadluqman@gmail.com?subject=' + subject + '&body=' + body;
    toast('Opening your email app…');
  });

  /* ---------------- stack count-up ---------------- */
  function countUp(node, target, duration){
    var startTs = null;
    function step(ts){
      if(startTs === null) startTs = ts;
      var t = Math.min(1, (ts-startTs)/duration);
      var eased = 1 - Math.pow(1-t, 3);
      node.textContent = Math.round(eased*target);
      if(t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  var stackCountEl = document.getElementById('stackCount');
  var stackSection = document.getElementById('stack-section');
  var stackObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        countUp(stackCountEl, DATA.stack.length, reduceMotion ? 1 : 900);
        stackObserver.disconnect();
      }
    });
  }, { threshold: 0.4 });
  stackObserver.observe(stackSection);

})();
